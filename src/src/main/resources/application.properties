# Concert Booking Platform - Backend Configuration

# Application
spring.application.name=booking
server.port=${PORT:8080}

# PostgreSQL (ACID for inventory & booking)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concert_booking}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - use 'validate' to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis (optional: caching & rate limiting for flash sale)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.client-type=lettuce

# JWT (authentication for operation dashboard)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.geek.booking=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}

spring.main.allow-bean-definition-overriding=true